name: CI

# Quick check on every push and PR: tests + build on Linux only.
# Full multi-OS matrix runs at release time (.github/workflows/release.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (linux-amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgl1-mesa-dev xorg-dev libxxf86vm-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
          version: "1.0"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -o /tmp/pz-manager ./cmd/manager
